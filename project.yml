name: Habits
options:
  bundleIdPrefix: com.sahil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K75VPCXM64
targets:
  Habits:
    type: application
    platform: iOS
    sources:
      - Habits
      - Shared
    dependencies:
      - target: HabitsWidget
        embed: true
    info:
      path: Habits/Info.plist
      properties:
        CFBundleDisplayName: Habits$
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.sahil.habits.term
            CFBundleURLSchemes: [habits]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahil.habits.term
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HabitsWidget:
    type: app-extension
    platform: iOS
    sources:
      - HabitsWidget
      - Shared
    info:
      path: HabitsWidget/Info.plist
      properties:
        CFBundleDisplayName: Habits$
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahil.habits.term.widget