name: Habits
options:
  bundleIdPrefix: com.sahil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K75VPCXM64
targets:
  Habits:
    type: application
    platform: iOS
    sources:
      - Habits
      - Shared
    scheme:
      # so `xcodebuild test -scheme Habits` runs the swipe tests
      testTargets:
        - HabitsUITests
        - HabitsTests
    dependencies:
      - target: HabitsWidget
        embed: true
    entitlements:
      path: Habits/Habits.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sahil.habits.term
    info:
      path: Habits/Info.plist
      properties:
        CFBundleDisplayName: Habits$
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.sahil.habits.term
            CFBundleURLSchemes: [habits]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahil.habits.term
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HabitsWidget:
    type: app-extension
    platform: iOS
    sources:
      - HabitsWidget
      - Shared
    entitlements:
      path: HabitsWidget/HabitsWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sahil.habits.term
    info:
      path: HabitsWidget/Info.plist
      properties:
        CFBundleDisplayName: Habits$
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahil.habits.term.widget
  # The only way to exercise a swipe. `simctl` cannot inject touches and neither can
  # `devicectl`, so without this target the drag gestures would ship unverified — and a drag
  # gesture that silently does nothing looks exactly like one that works.
  HabitsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HabitsUITests
    dependencies:
      - target: Habits
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahil.habits.term.uitests
        TEST_TARGET_NAME: Habits
        GENERATE_INFOPLIST_FILE: YES
  # The reminder schedule is arithmetic over dates — which days, what is already done, what has
  # passed — and it is the kind of code that is wrong in ways nobody notices for a week. A UI
  # test can only see that *something* was scheduled; this asserts which reminders, for when.
  HabitsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HabitsTests
    dependencies:
      - target: Habits
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahil.habits.term.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Habits.app/Habits"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES